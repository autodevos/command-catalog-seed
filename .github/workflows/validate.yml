name: Validate Bundles
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate all bundles against the schema + rules
        run: python scripts/validate_bundles.py
      - name: Build the platform seed module (bridge sanity)
        run: python scripts/build_seed_module.py --out /tmp/seed_commands.generated.json
